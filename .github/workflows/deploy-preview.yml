name: Deploy portfolio previews

on:
  push:
    branches:
      - main
      - repurpose_portfolio
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-root:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish main site
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .
          keep_files: true
          enable_jekyll: false
          exclude_assets: '.github'

  deploy-preview:
    if: github.ref_name != 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish branch preview
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .
          destination_dir: preview/${{ github.ref_name }}
          keep_files: true
          enable_jekyll: false
          exclude_assets: '.github'name: Deploy portfolio previews

